[package]
name = "wooma"
version = "0.1.0"
edition = "2024"
description = "A terminal toolkit for network diagnostics: ping, traceroute, dns, ip intel, whois, http timing, port scan and speed test"
license = "MIT OR Apache-2.0"
repository = "https://github.com/B33BMO/wooma"
readme = "README.md"
keywords = ["network", "tui", "traceroute", "dns", "ping"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
hickory-resolver = "0.26.3"
libc = "0.2.189"
ratatui = "0.30.2"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
socket2 = { version = "0.6.5", features = ["all"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "net", "sync", "io-util"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
toml = "1.1.6"
webpki-roots = "1.0.9"
x509-parser = "0.18.1"

[profile.release]
strip = true
lto = "thin"
